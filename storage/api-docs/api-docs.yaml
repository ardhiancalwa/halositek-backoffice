openapi: 3.0.0
info:
  title: 'HaloSitek Core API'
  description: 'OpenAPI metadata for HaloSitek Backoffice API.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000/api/v1'
    description: 'Local Development Server'
paths:
  /ai-chatbot/performance:
    get:
      tags:
        - 'AI Chatbot Management'
      summary: 'Get AI chatbot real-time performance'
      operationId: 2d1b658e8a9a45df85f30bb9d663f14a
      responses:
        200:
          description: 'Performance metrics retrieved'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Operation successful.'
                data:
                  total_generate: 320
                  total_success: 300
                  total_failed: 20
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /ai-chatbot/logs:
    get:
      tags:
        - 'AI Chatbot Management'
      summary: 'Get AI chatbot activity logs'
      operationId: c79e11067c9d259f5c8e2bcf77b67b7b
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - success
              - failed
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
      responses:
        200:
          description: 'Activity logs retrieved'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Log aktivitas AI chatbot berhasil diambil.'
                data:
                  -
                    id: 01J3AILOG0001
                    user:
                      id: 01J3USER001
                      name: 'Budi Santoso'
                    date: '2026-04-27T08:10:00+00:00'
                    prompt_preview: 'Generate konsep fasad rumah modern tropis.'
                    status: success
                    generate_time_ms: 1810
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 15
                  total: 1
                links:
                  first_page_url: 'http://localhost:8000/api/v1/ai-chatbot/logs?page=1'
                  last_page_url: 'http://localhost:8000/api/v1/ai-chatbot/logs?page=1'
                  next_page_url: null
                  prev_page_url: null
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  '/ai-chatbot/logs/{logId}':
    get:
      tags:
        - 'AI Chatbot Management'
      summary: 'Get AI chatbot activity log detail'
      operationId: fb76358cd9e60afc92b88f0fa3e1917b
      parameters:
        -
          name: logId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Activity log detail retrieved'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Detail log aktivitas AI chatbot berhasil diambil.'
                data:
                  id: 01J3AILOG0002
                  status: failed
                  user:
                    id: 01J3USER001
                    name: 'Budi Santoso'
                  date: '2026-04-27T09:10:00+00:00'
                  prompt_preview: 'Generate image masterplan urban mixed-use.'
                  generate_time_ms: 620
                  original_request: 'Generate image masterplan urban mixed-use detail...'
                  system_error_log: 'Inference timeout on provider A.'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /analytics/overview:
    get:
      tags:
        - Analytics
      summary: 'Get analytics overview'
      description: 'Returns overview metrics for registered users, approved architects, and active projects.'
      operationId: e461123aa143116cbcad1a8b7d26ae5e
      responses:
        200:
          description: 'Analytics overview retrieved successfully.'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Analytics overview retrieved successfully.'
                data:
                  registered_user: 120
                  registered_architect: 42
                  active_projects: 88
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /analytics/user-growth:
    get:
      tags:
        - Analytics
      summary: 'Get user growth'
      description: 'Returns user growth series based on selected range.'
      operationId: d4cc1ef6237502a876b2edd641bd08d7
      parameters:
        -
          name: range
          in: query
          required: false
          schema:
            type: string
            default: last_7_days
            enum:
              - today
              - last_7_days
              - last_month
      responses:
        200:
          description: 'User growth retrieved successfully.'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'User growth retrieved successfully.'
                data:
                  range: last_7_days
                  labels:
                    - '2026-04-20'
                    - '2026-04-21'
                    - '2026-04-22'
                    - '2026-04-23'
                    - '2026-04-24'
                    - '2026-04-25'
                    - '2026-04-26'
                  series:
                    - 2
                    - 1
                    - 0
                    - 3
                    - 1
                    - 2
                    - 1
                  cumulative_series:
                    - 2
                    - 3
                    - 3
                    - 6
                    - 7
                    - 9
                    - 10
                  total: 10
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /analytics/architect-growth:
    get:
      tags:
        - Analytics
      summary: 'Get architect growth'
      description: 'Returns approved architect growth series based on selected range.'
      operationId: deb4b7f21e038564bdb5d164a6965e91
      parameters:
        -
          name: range
          in: query
          required: false
          schema:
            type: string
            default: last_7_days
            enum:
              - today
              - last_7_days
              - last_month
      responses:
        200:
          description: 'Architect growth retrieved successfully.'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Architect growth retrieved successfully.'
                data:
                  range: last_month
                  labels:
                    - 'Apr 1 - Apr 7'
                    - 'Apr 8 - Apr 14'
                    - 'Apr 15 - Apr 21'
                    - 'Apr 22 - Apr 24'
                  series:
                    - 0
                    - 1
                    - 0
                    - 2
                  cumulative_series:
                    - 0
                    - 1
                    - 1
                    - 3
                  total: 3
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /auth/register:
    post:
      tags:
        - Auth
      summary: 'Register account'
      description: 'Registers a new user and returns an access token and refresh token.'
      operationId: f8f20d8e5fa3ee0d9ab537e9ac6206b5
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: 'Budi Santoso'
                email:
                  type: string
                  format: email
                  example: budi_santoso@gmail.com
                password:
                  type: string
                  format: password
                  example: password123
                password_confirmation:
                  type: string
                  format: password
                  example: password123
                role:
                  type: string
                  example: user
                photo_profile:
                  type: string
                  format: binary
              type: object
      responses:
        201:
          description: 'Registration successful'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 201
                message: 'Registration successful'
                data:
                  id: 01HZX9M1F45M2Z6K7T9K7Y8QRS
                  name: 'Budi Santoso'
                  email: budi_santoso@gmail.com
                  role: user
                  access_token: 1|plain-access-token
                  refresh_token: 2|plain-refresh-token
                  token_type: Bearer
                  expires_in: 3600
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 'Login account'
      description: 'Authenticates user credentials and returns a token pair.'
      operationId: 3d1aae0ea009e03fadebec819afd774e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: user@halositek.com
                password:
                  type: string
                  example: securepassword123
                role:
                  type: string
                  example: user
                  enum:
                    - user
                    - architect
                    - admin
              type: object
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Login successful'
                data:
                  id: 01HZX9M1F45M2Z6K7T9K7Y8QRS
                  name: 'Regular User'
                  email: user@halositek.com
                  role: user
                  access_token: 1|plain-access-token
                  refresh_token: 2|plain-refresh-token
                  token_type: Bearer
                  expires_in: 3600
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: 'Refresh access token'
      description: 'Exchanges a valid refresh token for a new token pair.'
      operationId: 2827f194f67f6d3538d73ad213edf819
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              type: object
      responses:
        200:
          description: 'Token refreshed successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Token refreshed successfully'
                data:
                  access_token: 3|plain-access-token
                  refresh_token: 4|plain-refresh-token
                  token_type: Bearer
                  expires_in: 3600
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /logout:
    post:
      tags:
        - Auth
      summary: 'Logout current session'
      description: 'Revokes the current access token and optionally the refresh token provided in the request body.'
      operationId: 6fa87e6ae9c508a3f355b05d51c4b335
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
              type: object
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Logout successful'
                data: null
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: 'Change password'
      description: "Changes the current authenticated user's password after validating the current password."
      operationId: 000615dea47b4e76d90368283f7d5ca5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - current_password
                - new_password
                - new_password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                  example: oldpassword123
                new_password:
                  type: string
                  format: password
                  example: newpassword123
                new_password_confirmation:
                  type: string
                  format: password
                  example: newpassword123
              type: object
      responses:
        200:
          description: 'Password changed successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Password berhasil diubah.'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /me:
    get:
      tags:
        - Users
      summary: 'Get current user profile'
      description: 'Returns the profile data of the currently authenticated user.'
      operationId: 4c4c7bf5b7dc5e997d9fb367439317d2
      responses:
        200:
          description: 'Profile retrieved successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Profile retrieved successfully'
                data:
                  id: 01HZX9M1F45M2Z6K7T9K7Y8QRS
                  name: 'Regular User'
                  email: user@halositek.com
                  role: user
                  account_status: active
                  created_at: '2026-04-13T10:00:00Z'
                  updated_at: '2026-04-13T10:00:00Z'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
    post:
      tags:
        - Users
      summary: 'Update current profile'
      description: 'Updates the profile of the currently authenticated user.'
      operationId: 5cfb418544966e592aa100b0e929828d
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              properties:
                name:
                  type: string
                  example: 'Budi Santoso'
                email:
                  type: string
                  format: email
                  example: budi@example.com
                password:
                  type: string
                  format: password
                  example: password123
                photo_profile:
                  type: string
                  format: binary
              type: object
      responses:
        200:
          description: 'Profile updated successfully.'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Profile updated successfully.'
                data:
                  user:
                    id: 01HZX9M1F45M2Z6K7T9K7Y8QRT
                    name: 'Updated User Name'
                    email: user@halositek.com
                    role: user
                    account_status: active
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  /auth/mobile/password/request-otp:
    post:
      tags:
        - Auth
      summary: 'Request mobile reset password OTP'
      description: "Generates a 4-digit OTP for mobile password reset and sends it to the user's email."
      operationId: 45cb9a2470ccab4dec13d420d9813c58
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@halositek.com
              type: object
      responses:
        200:
          description: 'OTP sent successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Kode OTP reset password telah dikirim ke email.'
                data:
                  expires_in_minutes: 10
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/mobile/password/verify-otp:
    post:
      tags:
        - Auth
      summary: 'Verify mobile reset password OTP'
      description: 'Validates a 4-digit mobile reset password OTP before the password is updated.'
      operationId: 7b546ee97169dba9919e21b5ffc37f1e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: user@halositek.com
                otp:
                  type: string
                  example: '1234'
              type: object
      responses:
        200:
          description: 'OTP valid'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Kode OTP valid.'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/mobile/password/reset:
    post:
      tags:
        - Auth
      summary: 'Reset mobile password using OTP'
      description: "Updates the user's password after validating a 4-digit OTP. The OTP is marked as used after a successful reset."
      operationId: 15ba6745eaa9f083365d72832b92c8d7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - otp
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                  example: user@halositek.com
                otp:
                  type: string
                  example: '1234'
                password:
                  type: string
                  format: password
                  example: newpassword123
                password_confirmation:
                  type: string
                  format: password
                  example: newpassword123
              type: object
      responses:
        200:
          description: 'Password reset successful'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Password berhasil direset.'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /awards:
    get:
      tags:
        - Awards
      summary: 'List awards'
      description: 'Returns a paginated award list with optional status filtering.'
      operationId: 0a0f62bf7d6ade3dcd31951445956654
      parameters:
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - declined
        -
          name: architect_id
          in: query
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: per_page
          in: query
          schema:
            type: integer
      responses:
        200:
          description: 'Awards retrieved successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Awards retrieved successfully'
                data:
                  -
                    id: 01HZX9M1F45M2Z6K7T9K7Y8QAW
                    name: 'Best Residential Design'
                    project_name: 'Modern House'
                    status: approved
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 12
                  total: 1
                links:
                  first_page_url: 'http://localhost:8000/api/v1/awards?page=1'
                  last_page_url: 'http://localhost:8000/api/v1/awards?page=1'
                  next_page_url: null
                  prev_page_url: null
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
    post:
      tags:
        - Awards
      summary: 'Create award'
      description: 'Creates a new award record by an architect, including verification file upload.'
      operationId: e71987245dd9f8dc0b3cb74fc09450fe
      requestBody:
        required: true
        content:
          multipart/form-data: []
      responses:
        201:
          description: 'Award created successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 201
                message: 'Award created successfully'
                data:
                  award:
                    id: 01HZX9M1F45M2Z6K7T9K7Y8QAW
                    name: 'Best Residential Design'
                    project_name: 'Modern House'
                    status: pending
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
  '/awards/{id}':
    get:
      tags:
        - Awards
      summary: 'Get award detail'
      description: 'Returns award details by id.'
      operationId: 2cd278c8adbf5af3a94c25f07f8d3a6e
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Award retrieved successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Award retrieved successfully'
                data:
                  award:
                    id: 01HZX9M1F45M2Z6K7T9K7Y8QAW
                    name: 'Best Residential Design'
                    project_name: 'Modern House'
                    status: approved
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
    put:
      tags:
        - Awards
      summary: 'Update award'
      description: 'Updates award data; admin users can only update award status.'
      operationId: 5dc0ab750512ffc1f56ae98585bd0d41
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data: []
      responses:
        200:
          description: 'Award updated successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Award updated successfully'
                data:
                  award:
                    id: 01HZX9M1F45M2Z6K7T9K7Y8QAW
                    name: 'Best Residential Design'
                    project_name: 'Modern House'
                    status: pending
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          BearerAuth: []
    delete:
      tags:
        - Awards
      summary: 'Delete award'
      description: 'Deletes an award record and its verification file by id.'
      operationId: 3651745e28646785f58c7e61e48d19d9
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Award deleted successfully'
          content:
            application/json:
              schema: []
              example:
                success: true
                status_code: 200
                message: 'Award deleted successfully'
                data: null
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
